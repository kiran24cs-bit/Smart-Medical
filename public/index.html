<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p id="shopheading">Smart Medical</p>
    </header>
    <div id="role">
        <button onclick="loadshopform()">Shop</button>
        <button onclick="loaduserform()">User</button>
    </div>
    <!-- User Register -->
<div id="userregisterdiv">

    <button type="button" class="roleloadbutton" onclick="loadrole()">Back</button>
    <p class="formheading">Register User</p>
    <form id="userregister">

        <label for="userregistermobile">Mobile Number</label>
        <input id="userregistermobile" type="tel" name="mobile_number" placeholder="Mobile Number" required>

        <label for="userregistername">Name</label>
        <input id="userregistername" type="text" name="name" placeholder="Name" required>

        <label for="userregisterplace">Place Name</label>
        <select id="userregisterplace" name="place_name" required>
            <option value="" disabled selected>Select Place</option>
        </select>

        <label for="userregisterpassword">Password</label>
        <input id="userregisterpassword" type="password" name="password" placeholder="Password" required>

        <button  type="submit">Register</button>

    </form>

    <p onclick="loaduserform()">
        Already have an account? Login
    </p>

</div>


<!-- User Login -->
<div id="userlogindiv">

    <button type="button" class="roleloadbutton" onclick="loadrole()">Back</button>
    <p class="formheading"> User Login</p>
    <form id="userlogin">

        <label for="userloginmobile">Mobile Number</label>
        <input id="userloginmobile" type="tel" name="mobile_number" placeholder="Mobile Number" required>

        <label for="userloginpassword">Password</label>
        <input id="userloginpassword" type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <p onclick="loaduserregister()">
        Don't have an account? Register
    </p>

</div>


<!-- Medical Shop Register -->
<div id="shopregisterdiv">

    <button type="button" class="roleloadbutton" onclick="loadrole()">Back</button>
    <p class="formheading">Register Shop</p>
    <form id="shopregister">

        <label for="shopregisterowner">Owner Name</label>
        <input id="shopregisterowner" type="text" name="owner_name" placeholder="Owner Name" required>

        <label for="shopregistermobile">Mobile Number</label>
        <input id="shopregistermobile" type="tel" name="mobile_number" placeholder="Mobile Number" required>

        <label for="shopregistername">Medical Shop Name</label>
        <input id="shopregistername" type="text" name="medical_shop_name" placeholder="Medical Shop Name" required>

        <label for="shopregisterplace">Place Name</label>
        <select id="shopregisterplace" name="place_name" required>
            <option value="" disabled selected>Select Place</option>
        </select>

        <label for="shopregisterpassword">Password</label>
        <input id="shopregisterpassword" type="password" name="password" placeholder="Password" required>
        
        <button type="button" onclick="findlocation()" id="findlocationbtn">Find Location</button>
        <button type="button" onclick="showlocationdiv()" >Enter location Manually</button>
        <div id="locationdiv">
        <label for="shopregisterlongitude">Longitude</label>
        <input id="shopregisterlongitude" type="text" name="longitude" placeholder="Longitude" required>

        <label for="shopregisterlatitude">Latitude</label>
        <input id="shopregisterlatitude" type="text" name="latitude" placeholder="Latitude" required>
        <a href="#" onclick="locateonmap()" >Locate Shop on map</a>
        </div>
        <button type="submit">Register</button>

    </form>

    <p onclick="loadshopform()">
        Already have a shop? Login
    </p>

</div>


<!-- Medical Shop Login -->
<div id="shoplogindiv">

    <button type="button" class="roleloadbutton" onclick="loadrole()">Back</button>
    <p class="formheading">Shop Login</p>
    <form id="shoplogin">

        <label for="shoploginmobile">Mobile Number</label>
        <input id="shoploginmobile" type="tel" name="mobile_number" placeholder="Mobile Number" required>

        <label for="shoploginname">Medical Shop Name</label>
        <input id="shoploginname" type="text" name="medical_shop_name" placeholder="Medical Shop Name" required>

        <label for="shoploginpassword">Password</label>
        <input id="shoploginpassword" type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <p onclick="loadshopregister()" >
        Don't have a shop? Create a shop
    </p>

</div>
<footer>
    <a onclick="getmedical('9000000003')">Kiran 2026</a>
</footer>
    <script src="script.js"></script>
</body>
</html>
