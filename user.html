<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Medical</title>
    <link rel="stylesheet" href="/user.css">
</head>

<body >

    <header>
        <p id="shopheading">Smart Medical</p>

        <div id="userdetails">
            <div>
                <p id="username"></p>
                <p id="userplace"></p>
            </div>
            <button id="editprofile"></button>
            <button id="logoutbtn"  >Logout</button>
           
        </div>
    </header>


    <main>

        <section id="searchsection">
            <input
                type="text"
                id="medicinesearch"
                placeholder="Search medicine..."
                autocomplete="off"
            >
        </section>


        <section id="medicinetablediv">

            <table id="medicinetable">
                    <tr>
                        <th>Medical Shop Name</th>
                        <th>Mobile Number</th>
                        <th>Medicine Name</th>
                        <th>Medicine Stock</th>
                        <th>Price</th>
                        <th>Address</th>
                        <th>Distance</th> 
                        <th>Map</th>
                    </tr>
            </table>

        </section>

    </main>


    <footer>
        <a >Kiran 2026</a>
    </footer>

    <script src="/userpagescript.js">
        
    </script>

</body>
</html>
